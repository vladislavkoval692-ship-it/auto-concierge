<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta_title">Autoconcierge-Service in der Schweiz — Premium Fahrzeugkauf, Verkauf & Rundum-Betreuung</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #d4af37;
            --accent-hover: #e6c55c;
            --accent-glow: rgba(212, 175, 55, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Убрал избыточный CSS для экономии места, ОСТАВЬ ВЕСЬ СВОЙ CSS ЗДЕСЬ БЕЗ ИЗМЕНЕНИЙ */
        /* Сюда вставляешь весь CSS из предыдущей версии от <style> до header */
        
        /* Скрытое поле для Honeypot (невидимо для человека, видимо для ботов) */
        .bot-trap {
            position: absolute;
            opacity: 0;
            z-index: -1;
            left: -9999px;
        }
        
        /* [ВСТАВИТЬ ВЕСЬ ОСТАЛЬНОЙ CSS ИЗ ТВОЕГО ФАЙЛА] */
    </style>
</head>
<body>
    <!-- [ВСТАВИТЬ ВЕСЬ HTML ОТ <header> ДО <section id="cantons"> ВКЛЮЧИТЕЛЬНО БЕЗ ИЗМЕНЕНИЙ] -->

    <!-- Modal Window -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h3 class="modal-title" data-i18n="modal_title">Anfrage absenden</h3>
            <p class="modal-subtitle" data-i18n="modal_subtitle">Fülle kurz das Formular aus – wir melden uns ASAP bei dir.</p>
            <form id="orderForm">
                
                <!-- Honeypot: Ловушка для ботов -->
                <div class="bot-trap" aria-hidden="true">
                    <label>Please leave this field empty</label>
                    <input type="text" id="honeyField" name="honey_trap" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-group">
                    <label data-i18n="form_name">Dein Name</label>
                    <input type="text" id="userName" class="form-control" required placeholder="Max Mustermann">
                </div>
                <div class="form-group">
                    <label data-i18n="form_phone">Telefon / WhatsApp</label>
                    <input type="text" id="userPhone" class="form-control" required placeholder="+41 ...">
                </div>
                <div class="form-group">
                    <label data-i18n="form_email">E-Mail-Adresse</label>
                    <input type="email" id="userEmail" class="form-control" required placeholder="beispiel@domain.ch">
                </div>
                <div class="form-group">
                    <label data-i18n="form_service">Leistungen</label>
                    <select id="modalServiceInput" class="form-control">
                        <option value="Individuelles Setup">Wähle eine Option oder übernehme den Rechner</option>
                        <option value="Auto-Kauf komplett (Rundum-Sorglos)">Auto-Kauf komplett (Rundum-Sorglos)</option>
                        <option value="Fahrzeugcheck & Live-Inspektion">Fahrzeugcheck & Live-Inspektion</option>
                        <option value="Preisverhandlung mit Verkäufer">Preisverhandlung mit Verkäufer</option>
                        <option value="Versicherungs-Setup">Versicherungs-Setup</option>
                        <option value="Aufbereitung für Verkauf">Aufbereitung für Verkauf</option>
                        <option value="Profi-Autofotoshooting">Profi-Autofotoshooting</option>
                        <option value="Erstellung Inserat">Erstellung Inserat</option>
                        <option value="Verkaufs-Support">Verkaufs-Support</option>
                        <option value="Experten-Beratung & Vergleich">Experten-Beratung & Vergleich</option>
                        <option value="Zulassungs-Service">Zulassungs-Service</option>
                        <option value="MFK-Prüfungshilfe">MFK-Prüfungshilfe</option>
                        <option value="Fahrzeugtransport">Fahrzeugtransport</option>
                        <option value="Post-Purchase Support">Post-Purchase Support</option>
                    </select>
                </div>
                <button type="submit" class="btn" id="submitBtn" data-i18n="form_submit">Jetzt anfragen</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 SWISS CARS. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // [ВСТАВИТЬ СЮДА ВСЮ ЛОГИКУ ВИДЕО, ПЕРЕВОДОВ И АНИМАЦИИ КАНТОНОВ БЕЗ ИЗМЕНЕНИЙ]

            // Интеграция отправки данных (ЗАЩИЩЕННАЯ ВЕРСИЯ)
            const orderForm = document.getElementById('orderForm');
            
            // Жесткий список разрешенных услуг для валидации на клиенте
            const validServices = [
                "Individuelles Setup",
                "Auto-Kauf komplett (Rundum-Sorglos)",
                "Fahrzeugcheck & Live-Inspektion",
                "Preisverhandlung mit Verkäufer",
                "Versicherungs-Setup",
                "Aufbereitung für Verkauf",
                "Profi-Autofotoshooting",
                "Erstellung Inserat",
                "Verkaufs-Support",
                "Experten-Beratung & Vergleich",
                "Zulassungs-Service",
                "MFK-Prüfungshilfe",
                "Fahrzeugtransport",
                "Post-Purchase Support"
            ];

            // Функция локальной очистки инъекций (убирает = + - @ в начале строки)
            const sanitizeInput = (str) => {
                const trimmed = str.trim();
                return /^[=+\-@]/.test(trimmed) ? "'" + trimmed : trimmed;
            };

            if (orderForm) {
                orderForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    // 1. Проверка Honeypot (если скрытое поле заполнено, это бот)
                    const honeyTrap = document.getElementById('honeyField').value;
                    if (honeyTrap !== "") {
                        console.warn("Bot activity detected. Form submission blocked.");
                        orderForm.reset();
                        document.getElementById('orderModal').classList.remove('active');
                        return; // Молча обрываем выполнение
                    }

                    // 2. Валидация выпадающего списка
                    const selectedService = document.getElementById('modalServiceInput').value;
                    if (!validServices.includes(selectedService)) {
                        alert("Manipulated data detected. Please select a valid service.");
                        return;
                    }

                    const submitBtn = document.getElementById('submitBtn');
                    const originalText = submitBtn.textContent;
                    submitBtn.textContent = currentLang === 'de' ? 'Senden...' : (currentLang === 'ru' ? 'Отправка...' : 'Відправка...');
                    submitBtn.setAttribute('disabled', 'true');

                    // 3. Формируем данные в формате x-www-form-urlencoded (безопасно для no-cors)
                    const formData = new URLSearchParams();
                    formData.append('name', sanitizeInput(document.getElementById('userName').value));
                    formData.append('phone', sanitizeInput(document.getElementById('userPhone').value));
                    formData.append('email', sanitizeInput(document.getElementById('userEmail').value));
                    formData.append('service', selectedService);
                    
                    // Защитный токен (усложняет спам прямыми запросами)
                    formData.append('source', 'swisscars_web_2026'); 

                    const scriptURL = 'https://script.google.com/macros/s/AKfycbyZp71TKlrcZduSfBQ25LTWxTtgoXwRhMAM_IEBLHESzmCxlljMm8L7h4SpQt_-7FiD/exec';

                    fetch(scriptURL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: formData.toString()
                    })
                    .then(() => {
                        alert(currentLang === 'de' ? 'Anfrage erfolgreich gesendet! Wir melden uns in Kürze.' : (currentLang === 'ru' ? 'Заявка успешно отправлена! Мы свяжемся с вами в ближайшее время.' : 'Заявка успішно надіслана! Ми зв\'яжемося з вами найближчим часом.'));
                        orderForm.reset();
                        document.getElementById('orderModal').classList.remove('active');
                    })
                    .catch(error => {
                        console.error('Error!', error.message);
                        alert(currentLang === 'de' ? 'Fehler beim Senden. Bitte schreibe uns auf WhatsApp.' : 'Произошла ошибка при отправке. Пожалуйста, напишите нам в WhatsApp.');
                    })
                    .finally(() => {
                        submitBtn.textContent = originalText;
                        submitBtn.removeAttribute('disabled');
                    });
                });
            }
        });
    </script>
</body>
</html>
